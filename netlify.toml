# Netlify: static build from site.config.ts.
# Another site from this repo (e.g. vibranic.be): new Netlify site, same repo, env var SITE=vibranic.
[build]
  command = "npm run generate"
  publish = ".output/public"

[build.environment]
  NODE_VERSION = "24"
  NPM_FLAGS = "--legacy-peer-deps"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# @nuxt/image writes webp bytes under the original extension (.jpg/.png), fix the type.
# Only valid while nuxt.config.ts `image.format` is ['webp'].
[[headers]]
  for = "/_ipx/*"
  [headers.values]
    Content-Type = "image/webp"

[[headers]]
  for = "/_nuxt/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
